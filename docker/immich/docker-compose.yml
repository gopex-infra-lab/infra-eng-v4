# Based on the official Immich compose, adapted to house conventions: pinned
# release, bind mounts, loopback-only port. Server and mobile app versions
# must stay in step — bump ${IMMICH_VERSION} deliberately, never "latest".
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Loopback only — reached over the OpenVPN tunnel via the reverse
      # proxy on this host.
      - "127.0.0.1:${IMMICH_SERVER_PORT}:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    networks:
      - immich_net
    security_opt:
      - no-new-privileges:true

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich-machine-learning
    restart: unless-stopped
    env_file: .env
    mem_limit: ${IMMICH_ML_MEM_LIMIT}
    volumes:
      - ./ml-cache:/cache
    networks:
      - immich_net
    security_opt:
      - no-new-privileges:true

  redis:
    image: ${IMMICH_REDIS_IMAGE}
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - immich_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: ${IMMICH_DB_IMAGE}
    container_name: immich-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - immich_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  immich_net:
    driver: bridge

services:
  db:
    image: ${NEXTCLOUD_MARIADB_IMAGE}
    container_name: nextcloud-db
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - nextcloud_dbdata:/var/lib/mysql
      - ./mariadb-nextcloud.cnf:/etc/mysql/conf.d/nextcloud.cnf:ro
    networks:
      - nextcloud_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${NEXTCLOUD_REDIS_IMAGE}
    container_name: nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    networks:
      - nextcloud_net
    security_opt:
      - no-new-privileges:true

  app:
    image: ${NEXTCLOUD_APP_IMAGE}
    container_name: nextcloud-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # All interfaces, not loopback-only: no reverse proxy exists yet.
      # No WAN forward; reachable only over LAN or the OpenVPN tunnel.
      - "${NEXTCLOUD_HTTP_PORT}:80"
    volumes:
      - nextcloud_html:/var/www/html
      - /mnt/nas/nextcloud:/var/www/html/data
      - ./config:/var/www/html/config
      - ./logs:/var/log/nextcloud
      - ./zz-nextcloud.ini:/usr/local/etc/php/conf.d/zz-nextcloud.ini:ro
    networks:
      - nextcloud_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  nextcloud_net:
    driver: bridge

volumes:
  nextcloud_html:
    name: nextcloud_html_data
  nextcloud_dbdata:
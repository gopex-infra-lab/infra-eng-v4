- hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH port
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 300
    - name: Wait for SSH to be ready
      wait_for_connection:
        timeout: 300
    - name: Wait for cloud-init to finish
      raw: cloud-init status --wait
      changed_when: false
    - name: Add host to known_hosts
      known_hosts:
        name: "{{ ansible_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -H ' + ansible_host) }}"
        path: "~/.ssh/known_hosts"

- hosts: all
  become: true
  roles:
    - bootstrap
    - ssh_setup
    - docker

- hosts: fastapi
  become: true
  roles:
    - app_fastapi

- hosts: bixi_db
  become: true
  roles:
    - bixi_db

- hosts: bixi_ingestor
  become: true
  vars:
    bixi_db_host: "{{ hostvars[groups['bixi_db'][0]]['ansible_host'] }}"
    bixi_gbfs_base_url: "https://gbfs.velobixi.com/gbfs/2-2/gbfs.json"
    bixi_fetch_interval: 5
  roles:
    - bixi_ingestor

- hosts: avelo_app
  become: true
  tags: [avelo, never]
  vars:
    avelo_image_tag: "{{ avelo_image_tag | default('latest') }}"
    avelo_grafana_password: "{{ avelo_grafana_password | default('') }}"
  roles:
    - role: avelo_app
      tags: [avelo, never]
  
- hosts: nextcloud
  become: true
  tags: [nextcloud, never]
  vars:
    nas_host: "192.168.0.22"
    nextcloud_nfs_export: "/volume1/homes"
    nextcloud_nfs_path: "/mnt/nas/nextcloud"
  roles:
    - role: nfs_client
      tags: [nextcloud, never]
      vars:
        nfs_mounts:
          - export: "{{ nextcloud_nfs_export }}"
            path: "{{ nextcloud_nfs_path }}"
    - role: nextcloud
      tags: [nextcloud, never]
 
- hosts: immich
  become: true
  tags: [immich, never]
  vars:
    nas_host: "192.168.0.22"
    immich_nfs_export: "/volume1/immich-library"
    immich_nfs_path: "/mnt/nas/immich"
  roles:
    - role: nfs_client
      tags: [immich, never]
      vars:
        nfs_mounts:
          - export: "{{ immich_nfs_export }}"
            path: "{{ immich_nfs_path }}"
    - role: immich
      tags: [immich, never]
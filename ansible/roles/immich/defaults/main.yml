---
immich_repo_dest: /opt/src/infra-eng-lab

# Pin the full release; server and mobile app versions must stay in step.
# CONFIRM current stable tag: https://github.com/immich-app/immich/releases
immich_version: "v1.135.3"
immich_db_image: "ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0"
immich_redis_image: "valkey/valkey:8-alpine"

immich_server_port: 2283          # loopback only — reverse proxy fronts it
immich_db_name: immich
immich_db_user: immich
immich_ml_mem_limit: "4g"

nfs_mounts:
  - export: /volume1/immich-library
    path: /mnt/nas/immich

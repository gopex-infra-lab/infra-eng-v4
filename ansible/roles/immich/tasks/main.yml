# ansible/roles/immich/tasks/main.yml
#
# House pattern (matches bixi_db / app_fastapi): create /opt/app, clone the
# infra repo, copy the static docker-compose.yml, render .env, deploy via
# docker_compose_v2. Assumes nfs_client already mounted /mnt/nas/immich.

- name: Assert the NAS library mount is present before deploying
  command: "findmnt -t nfs4 --target {{ nfs_mounts[0].path }}"
  changed_when: false

- name: Ensure runtime directory exists
  file:
    path: /opt/app
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Ensure data subdirectories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0750"
  loop:
    - /opt/app/ml-cache

- name: Create .env file
  copy:
    dest: /opt/app/.env
    content: |
      DB_PASSWORD={{ immich_db_password }}
      DB_USERNAME={{ immich_db_user }}
      DB_DATABASE_NAME={{ immich_db_name }}
      DB_HOSTNAME=db
      UPLOAD_LOCATION={{ nfs_mounts[0].path }}
      IMMICH_VERSION={{ immich_version }}
      IMMICH_DB_IMAGE={{ immich_db_image }}
      IMMICH_REDIS_IMAGE={{ immich_redis_image }}
      IMMICH_SERVER_PORT={{ immich_server_port }}
      IMMICH_ML_MEM_LIMIT={{ immich_ml_mem_limit }}
      TZ=America/Montreal
    owner: "{{ app_user }}"
    mode: "0600"
  no_log: true

- name: Ensure source directory exists
  file:
    path: /opt/src
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone repo (forced SSH command)
  become: true
  become_user: "{{ app_user }}"
  git:
    repo: "git@github.com:gopex-infra-lab/infra-eng-lab-v4.git"   # CONFIRM: see note in the nextcloud role
    dest: "{{ immich_repo_dest }}"
    version: dev
    accept_hostkey: yes
    key_file: "/home/{{ app_user }}/.ssh/id_ed25519_github"

- name: Copy docker-compose
  copy:
    src: "{{ immich_repo_dest }}/docker/immich/docker-compose.yml"
    dest: /opt/app/docker-compose.yml
    remote_src: yes

- name: Add user to docker group
  user:
    name: "{{ app_user }}"
    groups: docker
    append: yes

- name: Pull images for the pinned release
  community.docker.docker_compose_v2:
    project_src: /opt/app
    pull: always
    state: present

- name: Deploy containers (idempotent)
  community.docker.docker_compose_v2:
    project_src: /opt/app
    build: policy

- name: Wait for Immich server
  uri:
    url: "http://localhost:{{ immich_server_port }}/api/server/ping"
    status_code: 200
  register: immich_ping
  retries: 30
  delay: 10
  until: immich_ping.status == 200
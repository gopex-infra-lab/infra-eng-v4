name: Plan only (self-hosted, no Ansible)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "directory to plan"
        required: true
        default: "core-infra"
        type: choice
        options:
          - core-infra
          - lab
      confirm_apply:
        description: "type IMPORT-ONLY to apply a plan that only imports the VMs (blank = plan only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-state-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_pm_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_infra_public_key: ${{ secrets.INFRA_PUBLIC_KEY }}
      TF_VAR_infra_private_key: ${{ secrets.INFRA_PRIVATE_KEY }}
      TF_VAR_ansible_user: ${{ secrets.TF_VAR_ANSIBLE_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ github.event.inputs.environment }}
        run: terraform init -input=false

      - name: Forget old Telmate VM entries in state (idempotent, state only)
        if: github.event.inputs.environment == 'core-infra'
        working-directory: core-infra
        run: |
          set -euo pipefail
          S=/mnt/pve/nas/terraform-state/proxmox-core-v3.tfstate
          echo "--- before"
          terraform state list
          OLD=$(terraform state list | grep 'proxmox_vm_qemu' || true)
          if [ -z "$OLD" ]; then
            echo "nothing to forget"
          else
            cp -a "$S" "$S.pre-forget-$(date +%Y%m%d-%H%M%S)"
            while read -r addr; do
              terraform state rm "$addr" < /dev/null
            done <<< "$OLD"
          fi
          echo "--- after"
          terraform state list

      - name: Terraform plan (read-only)
        working-directory: ${{ github.event.inputs.environment }}
        run: terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan

      - name: Summary of Proxmox changes only
        if: always()
        working-directory: ${{ github.event.inputs.environment }}
        run: |
          if [ ! -f tfplan ]; then echo "no plan file"; exit 0; fi
          terraform show -json tfplan | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          for c in p.get("resource_changes",[]):
              ch=c["change"]
              print(c["address"], ch["actions"], "IMPORT" if ch.get("importing") else "")
              if c["type"].startswith("proxmox_"):
                  b=ch.get("before") or {}
                  a=ch.get("after") or {}
                  for k in sorted(set(b)|set(a)):
                      if b.get(k)!=a.get(k):
                          print("    ", k, ":", json.dumps(b.get(k)), "->", json.dumps(a.get(k)))
          '

      - name: Fail if the plan deletes or replaces a Proxmox resource
        working-directory: ${{ github.event.inputs.environment }}
        run: |
          terraform show -json tfplan | python3 -c 'import json,sys; p=json.load(sys.stdin); bad=[(c["address"],c["change"]["actions"]) for c in p.get("resource_changes",[]) if c["type"].startswith("proxmox_") and "delete" in c["change"]["actions"]]; print("BLOCKED", bad) if bad else print("ok: no delete or replace on proxmox resources"); sys.exit(1 if bad else 0)'

      - name: Import-only guard (refuses anything but imports and local files)
        if: github.event.inputs.confirm_apply == 'IMPORT-ONLY' && github.event.inputs.environment == 'core-infra'
        working-directory: core-infra
        run: |
          terraform show -json tfplan | python3 -c '
          import json,sys
          p=json.load(sys.stdin)
          bad=[]
          for c in p.get("resource_changes",[]):
              t=c["type"]; a=c["change"]["actions"]
              if t.startswith("proxmox_"):
                  if a!=["no-op"]: bad.append((c["address"],a))
              elif t=="null_resource":
                  if a!=["no-op"]: bad.append((c["address"],a))
              elif t=="local_file":
                  if a not in (["create"],["no-op"]): bad.append((c["address"],a))
              else:
                  bad.append((c["address"],a))
          print("GUARD BLOCKED", bad) if bad else print("guard ok: imports and local files only")
          sys.exit(1 if bad else 0)
          '

      - name: Apply the saved plan (import only)
        if: github.event.inputs.confirm_apply == 'IMPORT-ONLY' && github.event.inputs.environment == 'core-infra'
        working-directory: core-infra
        run: |
          terraform apply -input=false -no-color tfplan
          echo "--- state after"
          terraform state list

      - name: Remove the plan file
        if: always()
        working-directory: ${{ github.event.inputs.environment }}
        run: rm -f tfplan

name: Plan only (self-hosted, no Ansible)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "directory to plan"
        required: true
        default: "core-infra"
        type: choice
        options:
          - core-infra
          - lab
      forget_telmate_state:
        description: "ONE-TIME: back up the state, then forget the 3 old Telmate VM entries (VMs untouched)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-state-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_pm_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_infra_public_key: ${{ secrets.INFRA_PUBLIC_KEY }}
      TF_VAR_infra_private_key: ${{ secrets.INFRA_PRIVATE_KEY }}
      TF_VAR_ansible_user: ${{ secrets.TF_VAR_ANSIBLE_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ github.event.inputs.environment }}
        run: terraform init -input=false

      - name: Forget old Telmate VM entries in state (one-time)
        if: github.event.inputs.forget_telmate_state == 'true' && github.event.inputs.environment == 'core-infra'
        working-directory: core-infra
        run: |
          set -euo pipefail
          S=/mnt/pve/nas/terraform-state/proxmox-core-v3.tfstate
          cp -a "$S" "$S.pre-forget-$(date +%Y%m%d-%H%M%S)"
          echo "--- before"
          terraform state list
          for k in core-avelo core-immich core-nextcloud; do
            terraform state rm "module.core[\"$k\"].proxmox_vm_qemu.core"
          done
          echo "--- after"
          terraform state list

      - name: Terraform plan (read-only)
        working-directory: ${{ github.event.inputs.environment }}
        run: terraform plan -input=false -lock-timeout=60s -out=tfplan

      - name: Fail if the plan deletes or replaces a Proxmox resource
        working-directory: ${{ github.event.inputs.environment }}
        run: |
          terraform show -json tfplan | python3 -c 'import json,sys; p=json.load(sys.stdin); bad=[(c["address"],c["change"]["actions"]) for c in p.get("resource_changes",[]) if c["type"].startswith("proxmox_") and "delete" in c["change"]["actions"]]; print("BLOCKED", bad) if bad else print("ok: no delete or replace on proxmox resources"); sys.exit(1 if bad else 0)'

      - name: Remove the plan file
        if: always()
        working-directory: ${{ github.event.inputs.environment }}
        run: rm -f tfplan

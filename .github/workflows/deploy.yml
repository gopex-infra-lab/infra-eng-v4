name: Deploy (Terraform + Ansible)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, main ]

  workflow_dispatch:
    inputs:
      environment:
        description: "environment"
        required: true
        default: "lab"
        type: choice
        options:
          - lab
          - core
          - aws

      action:
        description: "terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
          - plan
          - import-db-nextcloud

      ansible_tags:
        description: "ansible tags to run (blank = current behavior)"
        required: false
        default: ""

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  block-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs to main
        run: |
          echo "Pull requests to main are not allowed. Please open a PR to dev branch."
          exit 1

  import-db-nextcloud:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'import-db-nextcloud'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

      - name: Place infra SSH key (reaches core-nextcloud)
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.INFRA_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_infra
          chmod 600 ~/.ssh/id_ed25519_infra

      - name: Place OLD-instance SSH key
        run: |
          printf "%s\n" "${{ secrets.OLD_NEXTCLOUD_SSH_KEY }}" > ~/.ssh/id_old_nextcloud
          chmod 600 ~/.ssh/id_old_nextcloud

      - name: Put the OLD instance into maintenance mode
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_old_nextcloud \
            "${{ secrets.OLD_NEXTCLOUD_SSH_USER }}@${{ secrets.OLD_NEXTCLOUD_HOST }}" \
            "${{ secrets.OLD_NEXTCLOUD_OCC_CMD }} maintenance:mode --on"

      - name: Dump the OLD database over SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_old_nextcloud \
            "${{ secrets.OLD_NEXTCLOUD_SSH_USER }}@${{ secrets.OLD_NEXTCLOUD_HOST }}" \
            "mysqldump --single-transaction --default-character-set=utf8mb4 ${{ secrets.OLD_NEXTCLOUD_DB_NAME }}" \
            > nextcloud.sql
          test -s nextcloud.sql

      - name: rsync the OLD data directory onto the NAS
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_old_nextcloud" \
            "${{ secrets.OLD_NEXTCLOUD_SSH_USER }}@${{ secrets.OLD_NEXTCLOUD_HOST }}:${{ secrets.OLD_NEXTCLOUD_DATA_PATH }}/" \
            /mnt/pve/nas/nextcloud-data/
          # CONFIRM the runner can reach this NAS path directly; if not,
          # route via core-nextcloud instead.

      - name: Import the dump into the NEW database container
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            nextcloud.sql "${{ secrets.TF_VAR_ANSIBLE_USER }}@192.168.0.190:/tmp/nextcloud.sql"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            "${{ secrets.TF_VAR_ANSIBLE_USER }}@192.168.0.190" \
            "docker exec -i nextcloud-db mariadb -u root -p'${{ secrets.NEXTCLOUD_DB_ROOT_PASSWORD }}' \
             ${{ secrets.OLD_NEXTCLOUD_DB_NAME }} < /tmp/nextcloud.sql && rm /tmp/nextcloud.sql"

      - name: Shred the local dump
        if: always()
        run: shred -u nextcloud.sql || rm -f nextcloud.sql

  deploy:
    if: |
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
      (github.ref == 'refs/heads/dev' && github.event_name == 'workflow_dispatch') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'core')
    runs-on: [self-hosted, Linux, X64]
    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_pm_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_infra_public_key: ${{ secrets.INFRA_PUBLIC_KEY }}
      TF_VAR_infra_private_key: ${{ secrets.INFRA_PRIVATE_KEY }}
      GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      TF_VAR_allowed_ssh_cidr: ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}
      TF_VAR_ansible_user: ${{ secrets.TF_VAR_ANSIBLE_USER }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" = "core" ]; then
            echo "DIR=core-infra" >> $GITHUB_OUTPUT
            echo "INV=inventory/core.ini" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" = "aws" ]; then
            echo "DIR=aws" >> $GITHUB_OUTPUT
            echo "INV=inventory/aws.ini" >> $GITHUB_OUTPUT
          else
            echo "DIR=lab" >> $GITHUB_OUTPUT
            echo "INV=inventory/lab.ini" >> $GITHUB_OUTPUT
          fi

      # Provider version bump REVERTED — it decoded core-avelo's existing
      # state under an incompatible schema ("unsupported attribute 'bridge'",
      # disk block field meanings changed) and risked a plan that would
      # destroy/recreate a VM that's already running real workloads. Back to
      # plain init, which uses core-infra/.terraform.lock.hcl as committed.
      - name: Terraform Init
        working-directory: ${{ steps.env.outputs.DIR }}
        run: terraform init -input=false

      # Non-destructive safety net before plan/apply can touch anything.
      # Adjust the source path if core-infra's backend stores state
      # somewhere other than the working directory (check backend.tf).
      - name: Backup Terraform state
        if: steps.env.outputs.DIR == 'core-infra'
        working-directory: ${{ steps.env.outputs.DIR }}
        run: cp terraform.tfstate terraform.tfstate.bak.$(date +%s) 2>/dev/null || true

      - name: Terraform Plan
        working-directory: ${{ steps.env.outputs.DIR }}
        run: terraform plan -input=false -out=tfplan -parallelism=1

      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        working-directory: ${{ steps.env.outputs.DIR }}
        run: terraform apply -auto-approve -parallelism=1 tfplan

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: ${{ steps.env.outputs.DIR }}
        run: terraform destroy -auto-approve -input=false

      - name: Install Ansible Collection
        working-directory: ansible
        run: ansible-galaxy collection install community.docker --force

      - name: Place GitHub key for Ansible
        run: |
          mkdir -p ansible/files
          printf "%s\n" "${{ secrets.GIT_PRIVATE_KEY }}" > ansible/files/id_ed25519_github
          chmod 600 ansible/files/id_ed25519_github

      - name: Place infra SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.INFRA_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_infra
          chmod 600 ~/.ssh/id_ed25519_infra

      # --- temporary diagnostics: manual runs only, remove once resolved ---
      - name: Check for a stray core-immich VM on pve3
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            root@192.168.0.254 "qm list"

      - name: Check for a stray core-nextcloud VM on pve1
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            root@192.168.0.253 "qm list"

      - name: Check whether core-immich's disk actually landed on pve2
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            root@192.168.0.254 "qm list" | awk '/core-immich/ {print $1}' | \
            xargs -I{} ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
              root@<pve2-ip> "qm config {}" || echo "no matching VM found on pve2"

      - name: Check Terraform state for core-immich and core-nextcloud
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: core-infra
        run: |
          terraform state list | grep -E "immich|nextcloud" || echo "not in state"

      # Lists recent qm-related tasks on pve1 so we can find the UPID of the
      # failed nextcloud clone/reconfigure task without guessing.
      - name: List recent qm tasks on pve1
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            root@192.168.0.253 \
            "pvesh get /nodes/pve1/tasks --limit 20 --output-format json \
             | python3 -c 'import sys,json; [print(t[\"upid\"], t.get(\"status\",\"\")) for t in json.load(sys.stdin) if \"qm\" in t[\"upid\"]]'"

      # Once the UPID for the failed task is known from the step above,
      # replace <UPID> below and re-run to get the actual rejected parameter.
      - name: Get full task log for the failed nextcloud task
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519_infra \
            root@192.168.0.253 "pvesh get /nodes/pve1/tasks/<UPID>/log"
      # --- end diagnostics ---

      - name: Generate AWS inventory
        if: steps.env.outputs.DIR == 'aws'
        run: |
          IP=$(terraform -chdir=aws output -raw ec2_public_ip)

          mkdir -p ansible/inventory

          cat <<EOF > ansible/inventory/aws.ini
          [aws]
          ec2 ansible_host=$IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/id_ed25519_infra ansible_python_interpreter=/usr/bin/python3 ansible_become=true

          [aws:vars]
          app_user=ec2-user
          EOF

      - name: Run Ansible
        if: github.event.inputs.action != 'destroy'
        working-directory: ansible
        env:
          FASTAPI_POSTGRES_DB:       ${{ vars.FASTAPI_POSTGRES_DB }}
          FASTAPI_POSTGRES_USER:     ${{ vars.FASTAPI_POSTGRES_USER }}
          FASTAPI_POSTGRES_PASSWORD: ${{ secrets.FASTAPI_POSTGRES_PASSWORD }}
          BIXI_POSTGRES_DB:          ${{ vars.BIXI_POSTGRES_DB }}
          BIXI_POSTGRES_USER:        ${{ vars.BIXI_POSTGRES_USER }}
          BIXI_POSTGRES_PASSWORD:    ${{ secrets.BIXI_POSTGRES_PASSWORD }}
          NEXTCLOUD_DB_PASSWORD:      ${{ secrets.NEXTCLOUD_DB_PASSWORD }}
          NEXTCLOUD_DB_ROOT_PASSWORD: ${{ secrets.NEXTCLOUD_DB_ROOT_PASSWORD }}
          NEXTCLOUD_SECRET:           ${{ secrets.NEXTCLOUD_SECRET }}
          NEXTCLOUD_PASSWORDSALT:     ${{ secrets.NEXTCLOUD_PASSWORDSALT }}
          NEXTCLOUD_INSTANCEID:       ${{ secrets.NEXTCLOUD_INSTANCEID }}
          IMMICH_DB_PASSWORD:         ${{ secrets.IMMICH_DB_PASSWORD }}
        run: |
          ansible-playbook site.yml \
            -i ${{ steps.env.outputs.INV }} \
            --private-key ~/.ssh/id_ed25519_infra \
            ${{ github.event.inputs.ansible_tags != '' && format('--tags {0}', github.event.inputs.ansible_tags) || '' }} \
            -e env=${{ github.event.inputs.environment }} \
            -e fastapi_postgres_db=$FASTAPI_POSTGRES_DB \
            -e fastapi_postgres_user=$FASTAPI_POSTGRES_USER \
            -e fastapi_postgres_password=$FASTAPI_POSTGRES_PASSWORD \
            -e bixi_postgres_db=$BIXI_POSTGRES_DB \
            -e bixi_postgres_user=$BIXI_POSTGRES_USER \
            -e bixi_postgres_password=$BIXI_POSTGRES_PASSWORD \
            -e app_user=$TF_VAR_ansible_user \
            -e "nextcloud_db_password=$NEXTCLOUD_DB_PASSWORD" \
            -e "nextcloud_db_root_password=$NEXTCLOUD_DB_ROOT_PASSWORD" \
            -e "nextcloud_secret=$NEXTCLOUD_SECRET" \
            -e "nextcloud_passwordsalt=$NEXTCLOUD_PASSWORDSALT" \
            -e "nextcloud_instanceid=$NEXTCLOUD_INSTANCEID" \
            -e "immich_db_password=$IMMICH_DB_PASSWORD"